<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM27</title>
    <script>
      const basePath = '/mm2027-website'
      const path = window.location.pathname
      const route = path.startsWith(basePath) ? path.slice(basePath.length) : path

      window.location.replace(`${basePath}/#${route || '/'}${window.location.search}${window.location.hash}`)
    </script>
  </head>
  <body></body>
</html>
